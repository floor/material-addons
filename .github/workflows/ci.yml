# Check source compatibility and the package consumers will install.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Match the npm CLI used by trusted publishing in release.yml.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Generated adapters
        run: bun run adapters:check
      - name: Types
        run: bun run ts:check
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build --production
      - name: Packed exports
        run: bun run check:package
      - name: Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: README examples, as written, against the packed package
        run: bun run readme:check
      - name: Autocomplete browser behavior
        run: bun run check:autocomplete
      - name: Stepper browser behavior
        run: bun run check:stepper
      - name: Expansion panel browser behavior
        run: bun run check:expansion-panel
      - name: Skeleton browser behavior
        run: bun run check:skeleton
      - name: Skeleton adapters in Chromium
        run: bun run check:skeleton-adapters
      - name: Stepper and autocomplete adapters in Chromium
        run: bun run check:stepper-adapters
      - name: Avatar and framework adapters in Chromium
        run: bun run check:avatar
      - name: Paginator and framework adapters in Chromium
        run: bun run check:paginator
      - name: Breadcrumb and framework adapters in Chromium
        run: bun run check:breadcrumb
      - name: Alert and framework adapters in Chromium
        run: bun run check:alert
