# Publishes material-addons to npm when a version tag is pushed, with npm trusted
# publishing: the workflow's identity is what npm trusts (configured on
# npmjs.com for the package), no token is stored, and the release carries
# provenance. A pre-release version (x.y.z-next.N) goes under the `next`
# dist-tag, anything else under `latest`.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A tag publishes only from main: refuse one whose commit is not an
      # ancestor of origin/main (fetched here so the check stands on its own).
      - name: The tagged commit must be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag is not on main"; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later; pinned on purpose, bump it deliberately
      - run: npm install -g npm@11.21.0

      - name: The tag must be the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Chromium for the README's examples
        run: npx playwright install --with-deps chromium

      # release:pack runs the gate once, then writes the tarball. Publishing that
      # file does not run lifecycle scripts, so prepublishOnly does not run again.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm run release:pack
          npm publish "material-addons-${version}.tgz" --provenance --access public --tag "$tag"
