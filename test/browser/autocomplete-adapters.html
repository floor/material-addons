<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Autocomplete adapter test</title>
<div id="fixture"></div>
<script type="module">
  import "material/styles";
  import "material-addons/styles";
  const target = document.getElementById("fixture");
  const framework = new URL(location.href).searchParams.get("framework");
  window.events = [];
  window.record = event => events.push([event.type, event.detail.value]);
  const choices = [
    { value: "ch", label: "Switzerland", supportingText: "Europe" },
    { value: "jp", label: "Japan" },
  ];
  if (framework === "react") {
    const { createElement: h, useState } = await import("react");
    const { createRoot } = await import("react-dom/client");
    const { Autocomplete, AutocompleteOption } = await import("material-addons/react");
    function App() {
      const [value, setValue] = useState(null);
      return h("div", null,
        h(Autocomplete, { value, strict: true, noOpenOnFocus: true, onInput: record, onSelect: record,
          onChange: event => { record(event); setValue(event.detail.value); } },
          choices.map(choice => h(AutocompleteOption, { ...choice, key: choice.value }))),
        h("output", null, value),
        h("button", { onClick: () => setValue("jp") }, "Set Japan"));
    }
    createRoot(target).render(h(App));
  } else if (framework === "vue") {
    const { createApp, h, ref } = await import("vue");
    const { MAutocomplete, MAutocompleteOption } = await import("material-addons/vue");
    createApp({
      setup() {
        const value = ref(null);
        return () => h("div", [
          h(MAutocomplete, { modelValue: value.value, strict: true, noOpenOnFocus: true, onInput: record,
            onSelect: record, onChange: record, "onUpdate:modelValue": next => { value.value = next; } },
            () => choices.map(choice => h(MAutocompleteOption, { ...choice, key: choice.value }))),
          h("output", value.value),
          h("button", { onClick: () => { value.value = "jp"; } }, "Set Japan"),
        ]);
      },
    }).mount(target);
  } else if (framework === "solid") {
    const { createSignal, createComponent } = await import("solid-js");
    const { render, Dynamic } = await import("solid-js/web");
    const { Autocomplete, AutocompleteOption } = await import("material-addons/solid");
    render(() => {
      const [value, setValue] = createSignal(null);
      return [
        createComponent(Autocomplete, {
          get value() { return value(); },
          strict: true, noOpenOnFocus: true, onInput: record, onSelect: record,
          onChange(event) { record(event); setValue(event.detail.value); },
          get children() { return choices.map(choice => createComponent(AutocompleteOption, choice)); },
        }),
        createComponent(Dynamic, { component: "output", get children() { return value(); } }),
        createComponent(Dynamic, { component: "button", onClick: () => setValue("jp"), children: "Set Japan" }),
      ];
    }, target);
  } else if (framework === "svelte") {
    const { mount } = await import("svelte");
    const { default: App } = await import("./AutocompleteSvelteFixture.svelte");
    mount(App, { target });
  }
</script>
